info:
  name: 03 - Listar con Filtro (GET 200)
  type: http

http:
  method: GET
  url: "{{baseUrl}}/api/frutas/c?categoria=Amarillo"
  params:
    - name: categoria
      value: Amarillo
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
