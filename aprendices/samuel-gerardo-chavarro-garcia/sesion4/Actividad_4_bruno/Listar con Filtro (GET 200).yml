info:
  name: Listar con Filtro (GET 200)
  type: http

http:
  method: GET
  url: "{{baseUrl}}/api/productos?categoria=hamburguesas"
  params:
    - name: categoria
      value: hamburguesas
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
