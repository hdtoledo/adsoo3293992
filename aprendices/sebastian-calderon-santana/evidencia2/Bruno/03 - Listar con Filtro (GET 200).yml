info:
  name: 03 - Listar con Filtro (GET 200)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/chocolates?categoria=meriendas"
  params:
    - name: categoria
      value: meriendas
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
